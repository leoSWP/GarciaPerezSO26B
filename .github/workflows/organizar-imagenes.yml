name: Organizar imágenes con IA

on:
  push:
    paths:
      - "practicas/**"
      - "scripts/organizar_imagenes.py"
      - ".github/workflows/organizar-imagenes.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: organizar-imagenes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  organizar:
    # Evita que ejecuciones de otros repositorios o ramas trabajen por accidente.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Detectar imágenes nuevas
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          : > added_images.txt

          # En ejecución manual, no procesar imágenes antiguas por accidente.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Ejecución manual: no se procesarán imágenes automáticamente."
            exit 0
          fi

          if [[ -z "${BEFORE_SHA:-}" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            # Primer push: limita el análisis al commit que disparó el workflow,
            # para evitar procesar todo el historial y generar un gasto inesperado.
            git diff-tree --no-commit-id --name-only -r --diff-filter=A "$AFTER_SHA" -- Practicas/ > added_images.txt
          else
            git diff --diff-filter=A --name-only "$BEFORE_SHA" "$AFTER_SHA" -- practicas/ > added_images.txt
          fi

          echo "Archivos nuevos detectados:"
          cat added_images.txt

      - name: Analizar, renombrar y documentar imágenes
        if: github.event_name == 'push'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: python scripts/organizar_imagenes.py

      - name: Guardar cambios en GitHub
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- practicas/
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "Automatización: organizar imágenes y documentar carpetas"
            git push
          fi
